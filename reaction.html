<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemiation · 化学反应原理机理推演工坊 (ReactionPrinciple)</title>
  <meta name="description" content="基于纯2D Canvas与空间伪3D纵深映射的化学反应机理推演工坊，支持化学键双向渐变、纯字母排印、氢原子全程严格守恒、聚合物大括号规范、右侧机理推演工作区与极简 ACPL 推演脚本编写。">
  <!-- 字体引入 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reaction.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部独立品牌导航栏 -->
    <header class="header-bar">
      <div class="brand-section">
        <div class="brand-logo">
          <span>CHEMIATION</span>
        </div>
      </div>

      <div id="header-equation-display" class="header-status-equation">
        <span id="reaction-equation">CH₃COOH + CH₃CH₂OH ⇌ CH₃COOCH₂CH₃ + H₂O</span>
      </div>
    </header>

    <!-- 主工作区：左侧 Canvas 伪3D视口 + 右侧反应推演工作区 -->
    <div class="main-workspace">
      <!-- 左侧 / 中央：纯 2D Canvas 拟态空间伪 3D 视口 (纯推演渲染器) -->
      <main class="viewport-wrapper">
        <canvas id="reaction-canvas"></canvas>

        <!-- 画布悬浮控制小工具 -->
        <div class="viewport-floating-toolbar">
          <button id="btn-zoom-in" class="tool-btn icon-only" title="放大 (滚轮向上)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="11" y1="8" x2="11" y2="14"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </button>
          <button id="btn-zoom-out" class="tool-btn icon-only" title="缩小 (滚轮向下)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </button>
          <button id="btn-reset-cam" class="tool-btn icon-only" title="视角复位居中 (快捷键: R)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
          </button>
          <button id="btn-toggle-rotate" class="tool-btn icon-only" title="自动缓速自转">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
        </div>

        <!-- 当前步骤状态悬浮胶囊 -->
        <div id="canvas-step-toast" class="canvas-step-toast">
          <span class="toast-num">第 1/4 步</span>
          <span class="toast-title">底物靠近</span>
        </div>

        <!-- 当工作区收起时显示的右侧唤醒按钮 -->
        <button id="btn-expand-workspace" class="btn-expand-workspace" title="展开推演工作区">
          <span>推演工作区 ⇤</span>
        </button>
      </main>

      <!-- 右侧：反应推演工作区 -->
      <aside id="workspace-sidebar" class="workspace-sidebar">
        <!-- 边缘调节宽度把手 -->
        <div id="resize-handle" class="resize-handle" title="左右拖拽调整工作区宽度"></div>

        <!-- 工作区头部 -->
        <div class="workspace-header">
          <div class="workspace-title-group">
            <span class="workspace-title">推演工作区</span>
            <span id="step-counter-text" class="step-counter-text">1 / 4</span>
          </div>
          <button id="btn-toggle-workspace" class="btn-toggle-workspace" title="收起推演工作区">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <!-- 工作区选项卡导航 -->
        <div class="workspace-tabs">
          <button id="tab-btn-steps" class="tab-btn active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span>机理步骤</span>
          </button>
          <button id="tab-btn-script" class="tab-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            <span>ACPL 脚本</span>
          </button>
        </div>

        <!-- 工作区滚动内容区 -->
        <div class="workspace-content">
          <!-- 选项卡 1: 机理与步骤列表 (纯推演模式) -->
          <div id="tab-pane-steps" class="tab-pane-steps">
            <!-- 本地项目工作区状态栏 -->
            <div id="project-bar" class="project-bar">
              <div class="project-info">
                <span class="project-folder-icon">📁</span>
                <span id="project-name-label" class="project-name-label" title="当前为内置预设模式。点击右侧按钮选择本地文件夹作为项目工作区">内置样例模式</span>
              </div>
              <div class="project-actions">
                <button id="btn-open-project" class="project-btn" title="选择本地文件夹作为项目工作区 (自动写入4个初始样例)">
                  打开项目目录
                </button>
                <button id="btn-new-reaction" class="project-btn" title="在当前项目目录新建反应机理文件" style="display: none;">
                  + 新建
                </button>
                <button id="btn-close-project" class="project-btn icon-only" title="退出项目模式，恢复内置样例" style="display: none;">
                  ✕
                </button>
              </div>
            </div>

            <!-- 反应预设选择器 -->
            <div class="preset-select-wrap">
              <select id="preset-select" class="preset-select" aria-label="选择化学反应"></select>
            </div>

            <!-- 反应总览信息卡片 -->
            <div class="reaction-overview-card">
              <div class="overview-top-row">
                <h3 id="reaction-title" class="overview-title">载入中...</h3>
                <span id="reaction-delta-h" class="overview-deltah">ΔH</span>
              </div>
              <div id="reaction-category" style="display:none;">机理推演</div>
              <p id="reaction-desc" class="overview-desc">反应机理推演载入中...</p>
            </div>

            <!-- 步骤流列表卡片容器 -->
            <div class="steps-list-header">
              <span>步骤序列</span>
              <span style="font-size: 11px; opacity: 0.6;">点击直达任意步</span>
            </div>
            <div id="steps-list-container" class="steps-list-container">
              <!-- 动态渲染各步骤卡片 -->
            </div>
          </div>

          <!-- 选项卡 2: 推演脚本编写 (简易 ACPL 编辑器) -->
          <div id="tab-pane-script" class="tab-pane-script">
            <div class="script-toolbar">
              <div class="script-toolbar-left">
                <span class="script-title">ACPL 推演脚本</span>
                <span id="file-save-status" class="file-save-status">已同步</span>
              </div>
              <div class="script-btn-group">
                <button id="btn-save-script" class="script-btn" title="保存至本地文件 (快捷键: Ctrl + S)">💾 保存</button>
                <button id="btn-reset-script" class="script-btn" title="还原为当前反应预设">↺ 还原</button>
                <button id="btn-run-script" class="script-btn primary" title="解析并立即运行推演脚本">▶ 解析运行</button>
              </div>
            </div>

            <!-- 快捷模板一键插入工具栏 -->
            <div class="script-templates-bar">
              <span class="template-label">模板:</span>
              <button class="template-pill" data-template="new_step" title="插入新的空白步骤">+ 步骤</button>
              <button class="template-pill" data-template="esterification" title="载入酯化模板">酯化</button>
              <button class="template-pill" data-template="co2_starch" title="载入CO2人工合成淀粉模板">淀粉合成</button>
              <button class="template-pill" data-template="chlorination" title="载入氯代模板">氯代</button>
              <button class="template-pill" data-template="haber_bosch" title="载入合成氨模板">合成氨</button>
              <button class="template-pill" data-template="co2_reduction" title="载入CO2还原模板">CO₂还原</button>
            </div>

            <div id="script-error-toast" class="script-error-toast"></div>

            <div class="script-editor-wrap">
              <textarea id="script-editor" class="script-editor" spellcheck="false" placeholder="在此编写或修改 ACPL 反应推演脚本..."></textarea>
            </div>

            <!-- 语法速查指南 -->
            <div class="script-syntax-guide">
              <span>💡 语法: <code>step "名称" { atom ID 元素 [X Y Z] ... bond A B [键级] polymer "n" }</code></span>
            </div>
          </div>
        </div>

        <!-- 工作区底部：推演进度与时序控制器 -->
        <footer class="workspace-footer">
          <!-- 步骤时序轨道 (Timeline Track) -->
          <div id="timeline-track" class="timeline-track-wrap"></div>

          <!-- 控制按钮栏 -->
          <div class="playback-controls-row">
            <div class="ctrl-btn-group">
              <button id="prev-btn" class="ctrl-btn" title="上一步 (快捷键: ← 或 A)">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="19 20 9 12 19 4 19 20"></polygon>
                  <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3"></line>
                </svg>
              </button>

              <button id="play-btn" class="ctrl-btn primary" title="自动推演 (快捷键: Space)">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </button>

              <button id="next-btn" class="ctrl-btn" title="下一步 (快捷键: → 或 D)">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5 4 15 12 5 20 5 4"></polygon>
                  <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3"></line>
                </svg>
              </button>

              <button id="reset-step-btn" class="ctrl-btn" title="回到起点">↺</button>
            </div>
          </div>
        </footer>
      </aside>
    </div>
  </div>

  <!-- 脚本加载 -->
  <script src="js/reaction/reactionData.js"></script>
  <script src="js/reaction/scriptParser.js"></script>
  <script src="js/reaction/storageManager.js"></script>
  <script src="js/reaction/pseudo3DRenderer.js"></script>
  <script src="js/reaction/reactionApp.js"></script>
</body>
</html>
